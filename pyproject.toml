[project]
name = "d2rloader"
version = "1.6.2"
dependencies = [
  "loguru>=0.7.3",
  "pluggy>=1.7.0",
  "psutil>=7.2.2",
  "pydantic>=2.14.1",
  "PySide6>=6.12.0",
  "pywin32>=312; platform_system == 'Windows'",
  "unidecode>=1.4.0",
]
requires-python = ">=3.12"
authors = [
  {name = "sh4nks", email = ""},
]
maintainers = [
  {name = "sh4nks", email = ""}
]
description = "Diablo 2 Resurrected Multi Loader"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["d2r", "qt", "diablo", "loader"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment"
]

[dependency-groups]
dev = [
  "ruff>=0.17.3",
  {include-group = "tox"},
  {include-group = "pre-commit"},
  {include-group = "typing"},
]
tox = [
  "tox>=4.67.4",
  "tox-uv",
]
pre-commit = [
  "pre-commit>=4.7.0",
  "pre-commit-uv",
]
typing = [
  "mypy",
  "pyright",
  "types-psutil",
  "types-pywin32",
]
gha-update = [
  "gha-update ; python_full_version >= '3.12'",
]
windows = [
  "pyinstaller>=6.22.3"
]
linux = [
  "python-appimage"
]
build = ["hatch"]

[project.urls]
Homepage = "https://github.com/sh4nks/d2rloader"
Documentation = "https://github.com/sh4nks/d2rloader"
Repository = "https://github.com/sh4nks/d2rloader"
"Bug Tracker" = "https://github.com/sh4nks/d2rloader/issues"
Changelog = "https://github.com/sh4nks/d2rloader/blob/master/CHANGELOG.md"

[project.scripts]
d2rloader = "d2rloader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["d2rloader"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
order-by-type = false

[tool.mypy]
python_version = "3.14"
files = ["d2rloader/"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
strict = true

[tool.basedpyright]
include = ["d2rloader"]
exclude = ["**/node_modules", "**/resources", "**/__pycache__"]
defineConstant = { DEBUG = true }
reportIgnoreCommentWithoutRule = false
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false


[tool.tox]
env_list = [
    "style",
    "typing",
]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
pass_env = ["CI"]
env_tmp_dir = "{toxworkdir}/tmp/{envname}"

[tool.tox.env.style]
description = "run all pre-commit hooks on all files"
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "run", "--all-files"]]

[tool.tox.env.typing]
description = "run static type checkers for linux and windows"
dependency_groups = ["typing"]
ignore_errors = true
commands = [
    ["mypy", "--platform", "linux", "--exclude", "d2rloader/core/platform_windows/"],
    ["mypy", "--platform", "win32"],
]

[tool.tox.env.update-actions]
description = "update GitHub Actions pins"
labels = ["update"]
dependency_groups = ["gha-update"]
skip_install = true
commands = [["gha-update"]]

[tool.tox.env.update-pre_commit]
description = "update pre-commit pins"
labels = ["update"]
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "autoupdate", "--freeze", "-j4"]]

[tool.tox.env.update-requirements]
description = "update uv lock"
labels = ["update"]
dependency_groups = []
no_default_groups = true
skip_install = true
commands = [["uv", "lock", {replace = "posargs", default = ["-U"], extend = true}]]
