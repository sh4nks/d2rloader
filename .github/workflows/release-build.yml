name: Release - Build PyInstaller Package and AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.13

      - name: Make PyInstaller Package
        run: uv run --group windows pyinstaller resources/D2RLoader.spec --noconfirm

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: "zip"
          filename: "D2RLoader.windows.zip"
          path: "./dist/D2RLoader/*"

      - name: Add release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "D2RLoader.windows.zip"
          artifactErrorsFailBuild: true
          allowUpdates: true
          generateReleaseNotes: false
          omitBody: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          replacesArtifacts: true

  release-appimage:
    # The bundled Qt xcb libraries are copied from the runner, so its glibc sets the minimum glibc of the AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install python-appimage builder
        run: |
          pip install python-appimage

      - name: Install Qt xcb platform plugin dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1

      - name: Stage Qt xcb platform plugin dependencies next to the PySide6 Qt libraries
        run: |
          QT_LIB_DIR=appimage-extra/opt/python3.13/lib/python3.13/site-packages/PySide6/Qt/lib
          mkdir -p "$QT_LIB_DIR"
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-cursor.so.0 \
            libxcb-icccm.so.4 libxcb-image.so.0 libxcb-keysyms.so.1 libxcb-randr.so.0 \
            libxcb-render.so.0 libxcb-render-util.so.0 libxcb-shape.so.0 libxcb-shm.so.0 \
            libxcb-sync.so.1 libxcb-util.so.1 libxcb-xfixes.so.0 libxcb-xkb.so.1; do
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$QT_LIB_DIR/"
          done

      - name: Build D2RLoader.AppImage
        run: |
          python -m python_appimage build app -p 3.13 ./resources/appimage/ -x appimage-extra/opt
          mv D2RLoader-x86_64.AppImage D2RLoader.AppImage

      - name: Add AppImage to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.AppImage"
          artifactErrorsFailBuild: true
          allowUpdates: true
          generateReleaseNotes: false
          omitBody: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          replacesArtifacts: true
